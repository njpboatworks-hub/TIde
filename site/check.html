<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nockd check</title>
<style>
  body { margin: 0; background: #0A1A30; color: #E9EEF5; font: 15px/1.45 system-ui, -apple-system, sans-serif; padding: 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { margin: 0 0 14px; color: #A9B8CC; }
  table { border-collapse: collapse; width: 100%; max-width: 820px; } td { border-top: 1px solid #22344F; padding: 7px 8px; vertical-align: top; }
  td:first-child { width: 42%; color: #C9D6E6; } .ok { color: #5BE09A; font-weight: 700; } .bad { color: #FF6B6B; font-weight: 700; } .wait { color: #F5C242; }
  #map { height: 260px; max-width: 820px; margin-top: 14px; border: 1px solid #22344F; } code { font-size: 12.5px; color: #C9D6E6; word-break: break-all; }
</style></head>
<body>
<h1>Nockd check</h1>
<p>This page tests what Nockd needs, in this browser. Please take a screenshot of the whole page and send it.</p>
<table id="t"></table>
<div id="map"></div>
<script>
const T = document.getElementById("t");
function row(name, cls, text) { const tr = document.createElement("tr"); tr.innerHTML = `<td>${name}</td><td class="${cls}">${text}</td>`; T.appendChild(tr); return tr; }
const errs = []; window.addEventListener("error", (e) => errs.push((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")));
window.addEventListener("unhandledrejection", (e) => errs.push("promise: " + (e.reason && e.reason.message || e.reason)));
row("Browser", "", `<code>${navigator.userAgent}</code>`);
row("Screen", "", `${screen.width}×${screen.height}, pixel ratio ${window.devicePixelRatio}, CPU cores ${navigator.hardwareConcurrency || "?"}, memory ${navigator.deviceMemory || "?"} GB`);
// canvas drawing (what the borders use)
try {
  const c = document.createElement("canvas"); c.width = 400; c.height = 300; const x = c.getContext("2d");
  x.fillStyle = "#000"; x.beginPath(); x.moveTo(10, 10); x.lineTo(390, 10); x.lineTo(200, 290); x.fill("evenodd");
  const a = x.getImageData(200, 100, 1, 1).data[3];
  const big = document.createElement("canvas"); big.width = 3000; big.height = 3000; const bx = big.getContext("2d"); bx.fillRect(0, 0, 10, 10);
  const b = bx.getImageData(5, 5, 1, 1).data[3];
  row("Map drawing (canvas)", a > 0 && b > 0 ? "ok" : "bad", a > 0 && b > 0 ? "Works" : `Not working (small ${a}, large ${b}). Drawing may be blocked by a browser setting or extension.`);
} catch (e) { row("Map drawing (canvas)", "bad", "Error: " + e.message); }
try { const g = document.createElement("canvas").getContext("webgl"); row("Graphics acceleration", g ? "ok" : "wait", g ? "On" : "Off (maps will be slower)"); } catch (e) { row("Graphics acceleration", "wait", "Unknown"); }
// data files
const FILES = [["Borders, whole world", "world/land-50m.json"], ["Borders, detailed (Newport area)", "world/l10/40_-80.json"], ["Coastlines", "world/coast-50m.json"],
  ["Place names", "places.json"], ["Cruising places index", "boating/index.json"], ["Cruising places (Rhode Island)", "boating/40_-75.json"], ["Live wind and stations", "live.json"], ["Forecast index", "global/meta.json"]];
(async () => {
  for (const [name, f] of FILES) {
    const tr = row(name, "wait", "loading…"), td = tr.lastChild, t0 = performance.now();
    try {
      const r = await fetch(f + "?check=" + Date.now(), { cache: "no-store" }), txt = await r.text(), ms = Math.round(performance.now() - t0);
      let ok = r.ok, note = `${r.status}, ${(txt.length / 1e6).toFixed(2)} MB, ${ms} ms`;
      if (ok) { try { JSON.parse(txt); } catch (_) { ok = false; note += `, not valid data (starts: ${txt.slice(0, 40).replace(/</g, "&lt;")})`; } }
      td.className = ok ? "ok" : "bad"; td.innerHTML = (ok ? "Loads · " : "Problem · ") + note;
    } catch (e) { td.className = "bad"; td.textContent = "Blocked or failed: " + e.message; }
  }
  // map library
  const lr = row("Map library (Leaflet)", "wait", "loading…");
  const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";
  s.onload = () => { lr.lastChild.className = "ok"; lr.lastChild.textContent = "Loads";
    try { const m = L.map("map", { zoomControl: false }).setView([41.48, -71.33], 10);
      fetch("world/land-50m.json").then((r) => r.json()).then((polys) => { const feats = polys.map((p) => ({ type: "Feature", geometry: { type: "Polygon", coordinates: p } }));
        L.geoJSON({ type: "FeatureCollection", features: feats }, { style: { color: "#F27A48", weight: 1.5, fillColor: "#24384F", fillOpacity: 0.9 } }).addTo(m);
        row("Borders drawn on a test map", "ok", "If you see land shapes in the box below, borders can be drawn in this browser."); });
    } catch (e) { row("Test map", "bad", e.message); } };
  s.onerror = () => { lr.lastChild.className = "bad"; lr.lastChild.textContent = "Blocked or failed (cdn.jsdelivr.net). Maps can't run without it."; };
  document.head.appendChild(s);
  setTimeout(() => row("Errors on this page", errs.length ? "bad" : "ok", errs.length ? errs.map((e) => `<code>${String(e).replace(/</g, "&lt;")}</code>`).join("<br>") : "None"), 6000);
})();
</script>
</body></html>
