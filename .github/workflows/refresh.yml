# Refreshes the wind forecast, station readings and tide/current predictions every day,
# rebuilds the website folder and publishes it to Netlify.
# Needs two repository secrets: NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID (see deploy/AUTO_UPDATE.md).
# The AI coach also needs ANTHROPIC_API_KEY set as an environment variable in Netlify (not in GitHub).
name: Refresh wind data

on:
  schedule:
    - cron: "23 10 * * *"   # every day at 10:23 UTC (about 6 AM Eastern in summer, 5 AM in winter)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements-refresh.txt

      - name: Download latest readings and the 7-day NWS forecast
        run: python -m scripts.live_snapshot

      - name: Download tide and current predictions
        run: python -m scripts.tides_snapshot

      - name: Live tide correction (how far real-time NOAA gauges read above or below the prediction)
        run: python -m scripts.tide_residual

      - name: West Coast, Great Lakes and Hawaii - latest readings, NWS forecast, NOAA tides and currents
        run: |
          for r in west lakes hawaii; do python -m scripts.us_build $r live tides; done

      - name: Spain and Portugal - latest readings and MET Norway forecast
        run: python -m scripts.iberia_build live

      - name: Spain and Portugal - recalculate tides (Mondays, or when run by hand; predictions run 30 days ahead)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install utide && python -m scripts.iberia_build tides
          else
            echo "Not Monday: keeping last week's tide predictions"
          fi

      - name: Worldwide wind and weather (NOAA GFS, 16 days) and ocean currents (NOAA RTOFS, 8 days)
        run: |
          pip install eccodes netCDF4 pillow shapely
          python -m scripts.global_wx gfs
          python -m scripts.global_wx rtofs || echo "Ocean currents not refreshed today (keeping the previous run)"

      - name: Cruising places - anchorages, moorings, marinas, pump-outs (Mondays, or when run by hand)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m scripts.boating_places || echo "Cruising places not refreshed (keeping last week's list)"
            python -m scripts.discharge_zones || echo "Discharge-rule map not refreshed (keeping last week's)"
          else
            echo "Not Monday: keeping last week's cruising places"
          fi

      - name: Continue the coast-map forecasts past the NWS 7 days with GFS (to 16 days)
        run: python -m scripts.extend_forecast

      - name: Build the website folder
        run: python -m scripts.build_deploy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the AI coach function's package (Anthropic SDK)
        run: npm ci --omit=dev

      - name: Publish to Netlify (website + AI coach function)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir deploy/sailiq-wind-site --functions netlify/functions --message "Daily data refresh"
