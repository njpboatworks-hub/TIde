# Builds the Cruising tab's data (site/boating.json and site/discharge.json) on GitHub's computers, which can reach
# OpenStreetMap, NOAA, EPA and BOEM. Runs daily and can be run by hand (Actions -> Build cruising data -> Run workflow).
# OpenStreetMap is asked in 2 x 2.5 degree squares spread over 6 machines with a time budget each; every answered
# square is saved in data/osm/, and each run asks for missing squares first, then the oldest, so coverage fills in
# over a few runs and then stays fresh. The merged result is committed and the daily refresh publishes it.
name: Build cruising data

on:
  schedule:
    - cron: "37 */6 * * *"   # every 6 hours (the repository is public, so the minutes are free): missing squares first, then the oldest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cruise-data
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenStreetMap squares, part ${{ matrix.part }}
        run: |
          mkdir -p new-squares
          python -m scripts.boating_places osm-part ${{ matrix.part }} 6 new-squares 2700
      - uses: actions/upload-artifact@v4
        with:
          name: osm-part-${{ matrix.part }}
          path: new-squares/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: osm
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements-refresh.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-part-*
          path: osm-parts
      - name: Cruising places (NOAA charts + the OpenStreetMap parts)
        run: python -m scripts.boating_places --osm-dir osm-parts
      - name: Discharge rules (EPA No Discharge Zones + 3 nautical mile line)
        run: python -m scripts.discharge_zones || echo "discharge map not rebuilt; keeping the previous one"
      - name: Bridges, cables, Coast Guard, restricted areas
        run: python -m scripts.nav_hazards || echo "chart hazards not rebuilt; keeping the previous ones"
      - name: NWS marine zone outlines (rebuilt monthly)
        run: python -m scripts.marine_zones --if-older 30 || echo "marine zones not rebuilt; keeping the previous ones"
      - uses: actions/upload-artifact@v4
        with:
          name: cruising-data
          path: |
            site/boating.json
            site/discharge.json
            site/nav.json
            site/marinezones.json
          retention-days: 14
      - name: Save the new data in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/boating.json site/discharge.json site/nav.json site/marinezones.json data/osm
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Cruising data refresh"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
