# Builds the Cruising tab's data (site/boating.json and site/discharge.json) on GitHub's computers, which can reach
# OpenStreetMap, NOAA, EPA and BOEM. Runs every Sunday and can be run by hand (Actions -> Build cruising data ->
# Run workflow). OpenStreetMap is asked in map squares spread over 6 machines, each with a time budget, so one slow
# server cannot sink the run; the merged result is committed to the repository and the daily refresh publishes it.
name: Build cruising data

on:
  schedule:
    - cron: "37 6 * * 0"   # Sundays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cruise-data
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenStreetMap squares, part ${{ matrix.part }}
        run: python -m scripts.boating_places osm-part ${{ matrix.part }} 6 osm-part-${{ matrix.part }}.json 2700
      - uses: actions/upload-artifact@v4
        with:
          name: osm-part-${{ matrix.part }}
          path: osm-part-${{ matrix.part }}.json
          retention-days: 7

  build:
    needs: osm
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements-refresh.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-part-*
          path: osm-parts
      - name: Cruising places (NOAA charts + the OpenStreetMap parts)
        run: python -m scripts.boating_places --osm-dir osm-parts
      - name: Discharge rules (EPA No Discharge Zones + 3 nautical mile line)
        run: python -m scripts.discharge_zones || echo "discharge map not rebuilt; keeping the previous one"
      - uses: actions/upload-artifact@v4
        with:
          name: cruising-data
          path: |
            site/boating.json
            site/discharge.json
          retention-days: 14
      - name: Save the new data in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/boating.json site/discharge.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly cruising data refresh"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
